[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kug-dach"
version = "1.0.0"
description = "Kurzarbeitergeld-Rechner 2026 fuer Deutschland nach SGB III und KUG-Verordnung sowie AT KUA und CH KAE"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "DACH Digitalwerk", email = "dach.digitalwerk@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
dach-kug = "kug_dach.cli:main"

[project.urls]
"Homepage" = "https://dachdigitalwerk.github.io/kurzarbeitergeld-rechner/"
"Bug Tracker" = "https://github.com/DACHDigitalwerk/kug-kurzarbeitergeld-rechner-dach/issues"
"Source" = "https://github.com/DACHDigitalwerk/kug-kurzarbeitergeld-rechner-dach"
